# keygate config

addr=:8080
master_key=kg_master_local
allowed_providers=telegram,openai,aws,anthropic
allowed_scopes=read,send,admin
max_ttl=300
deny_unknown=true
rate_per_minute=60

# Демо-ключи. Настоящие ключи здесь не хранятся.
provider.telegram=123456789:FAKE_DEMO_TOKEN
provider.openai=sk-FAKE-DEMO-KEY
provider.aws=AKIAFAKEDEMOKEY0000
